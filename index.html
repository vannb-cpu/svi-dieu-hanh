<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SVI 169NNV – Điều hành tòa nhà</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EDF0F1;--surface:#FFF;--ink:#14232B;--muted:#5B6B73;--line:#D8DFE2;--ok:#2E7D5B;--watch:#A86C12;--alert:#C0392B;--accent:#1F5F7A;
--ok-bg:#E3F1EA;--watch-bg:#F8ECD3;--alert-bg:#F8DEDA;--accent-bg:#DCEBF1;--panel:#15242C;--panel-ink:#E8EEF0;--panel-muted:#9AAEB6;--panel-line:#2A3B44;
--lamp-ok:#4CD39A;--lamp-watch:#F0B44C;--lamp-alert:#FF7A69;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E171C;--surface:#16232A;--ink:#E6EDEF;--muted:#93A5AD;--line:#2A3A42;--ok:#4CB98A;--watch:#E0A94A;--alert:#EE7B6C;--accent:#6FB4CE;--ok-bg:#173A2D;--watch-bg:#3C2E12;--alert-bg:#432019;--accent-bg:#17323D;--panel:#0A1419;--panel-line:#22323A;}}
:root[data-theme="dark"]{--bg:#0E171C;--surface:#16232A;--ink:#E6EDEF;--muted:#93A5AD;--line:#2A3A42;--ok:#4CB98A;--watch:#E0A94A;--alert:#EE7B6C;--accent:#6FB4CE;--ok-bg:#173A2D;--watch-bg:#3C2E12;--alert-bg:#432019;--accent-bg:#17323D;--panel:#0A1419;--panel-line:#22323A;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
p{margin:0;}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);}
.top-in{max-width:820px;margin:0 auto;padding:12px 16px 0;}
.title-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
h1{font-size:19px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em;}
.who{font-size:12px;color:var(--muted);}
.who button{background:none;border:0;color:var(--accent);padding:0 0 0 6px;cursor:pointer;font-size:12px;}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:8px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;cursor:pointer;color:var(--muted);font-weight:500;min-height:40px;}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);}
.tab .n{display:inline-block;min-width:20px;margin-left:5px;padding:0 6px;border-radius:999px;background:var(--alert);color:#fff;font-size:12px;line-height:18px;text-align:center;}
main{max-width:820px;margin:0 auto;padding:16px 16px 64px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.stale{margin:0 0 14px;padding:10px 12px;border-radius:8px;background:var(--alert-bg);color:var(--alert);font-size:13px;font-weight:500;}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw;}
h2{font-size:17px;line-height:1.3;margin:26px 0 10px;font-weight:600;}
h2:first-child{margin-top:0;}
h3{font-size:15px;margin:0;font-weight:600;}
.muted{color:var(--muted);} .small{font-size:13px;}
.days{display:flex;gap:6px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none;}
.days::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;min-height:34px;}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.chip small{opacity:.7;margin-left:4px;}
.board{background:var(--panel);color:var(--panel-ink);border-radius:14px;padding:14px 16px;}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
.board-head h2{margin:0;color:var(--panel-ink);}
.board-sum{font-size:13px;color:var(--panel-muted);}
.todo{list-style:none;margin:10px 0 0;padding:0;}
.todo li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--panel-line);}
.todo li:first-child{border-top:0;}
.todo .lamp{margin-top:6px;}
.todo button{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--panel-ink);}
.todo button:hover .t{text-decoration:underline;}
.todo .d{display:block;font-size:13px;color:var(--panel-muted);}
.lamp{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
.lamp.ok{background:var(--lamp-ok);box-shadow:0 0 8px var(--lamp-ok);} .lamp.watch{background:var(--lamp-watch);box-shadow:0 0 8px var(--lamp-watch);} .lamp.alert{background:var(--lamp-alert);box-shadow:0 0 8px var(--lamp-alert);}
.allgood{padding:12px 0 4px;color:var(--panel-muted);}
.cover{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
.cv{background:var(--surface);border-radius:10px;padding:10px 12px;}
.cv .k{font-size:13px;color:var(--muted);}
.cv .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;}
.cv .v small{font-size:14px;font-weight:500;color:var(--muted);}
.cv.bad .v{color:var(--alert);} .cv .miss{font-size:12px;color:var(--alert);margin-top:2px;}
.sys{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 16px;background:var(--surface);border-radius:12px;padding:2px 14px;}
.sys div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.sysgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.st{background:var(--surface);border-radius:10px;padding:10px 12px;display:grid;gap:4px;}
.st .n{font-size:13px;color:var(--muted);}
.st .v{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;}
.st.alert{background:var(--alert-bg);} .st.alert .v{color:var(--alert);}
.st.watch{background:var(--watch-bg);} .st.watch .v{color:var(--watch);}
.state{display:inline-flex;align-items:center;gap:7px;text-align:right;font-size:14px;}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block;}
.dot.ok{background:var(--ok);} .dot.watch{background:var(--watch);} .dot.alert{background:var(--alert);} .dot.none{background:var(--line);}
.list{display:grid;gap:10px;}
.card{background:var(--surface);border-radius:12px;padding:12px 14px;border-left:4px solid var(--line);}
.card.l-alert{border-left-color:var(--alert);} .card.l-watch{border-left-color:var(--watch);} .card.l-ok{border-left-color:var(--ok);} .card.l-info{border-left-color:var(--accent);}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
.meta{font-size:13px;color:var(--muted);margin-top:2px;}
.card p{margin-top:6px;} .card p b{font-weight:600;}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;}
.pill.alert{background:var(--alert-bg);color:var(--alert);} .pill.watch{background:var(--watch-bg);color:var(--watch);} .pill.ok{background:var(--ok-bg);color:var(--ok);} .pill.info{background:var(--accent-bg);color:var(--accent);}
.pills{display:flex;gap:6px;flex-wrap:wrap;}
.patrol{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.pt{font-size:12px;padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums;}
.pt.y{background:var(--ok-bg);color:var(--ok);} .pt.n{background:var(--alert-bg);color:var(--alert);text-decoration:line-through;}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px;}
.bar i{display:block;height:100%;background:var(--ok);} .bar.part i{background:var(--watch);}
.grid-wrap{overflow-x:auto;background:var(--surface);border-radius:12px;}
table.mx{border-collapse:collapse;width:100%;min-width:520px;font-size:13px;}
.mx th,.mx td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);}
.mx th:first-child,.mx td:first-child{text-align:left;padding-left:12px;white-space:nowrap;}
.mx thead th{font-weight:500;color:var(--muted);}
.mx .sel{background:var(--accent-bg);}
.mx.att td{text-align:left;} .mx.att th{vertical-align:top;} .mx td.bad{color:var(--alert);font-weight:600;}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.hist{margin-top:8px;font-size:13px;color:var(--muted);}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px;font-size:14px;}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.btn.big{width:100%;min-height:52px;font-size:16px;}
.btn:disabled{opacity:.5;cursor:default;}
.form{background:var(--surface);border-radius:12px;padding:14px;display:grid;gap:12px;}
.form label,.fl{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;}
input[type=text],input[type=password],select,textarea{width:100%;font-size:16px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);}
textarea{min-height:70px;resize:vertical;}
.seg{display:flex;gap:4px;flex-wrap:wrap;}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;min-height:36px;}
.seg button[aria-pressed="true"].ok{background:var(--ok);border-color:var(--ok);color:#fff;}
.seg button[aria-pressed="true"].watch{background:var(--watch);border-color:var(--watch);color:#fff;}
.seg button[aria-pressed="true"].alert{background:var(--alert);border-color:var(--alert);color:#fff;}
.sysrow{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line);}
.checks{display:grid;gap:2px;}
.checks label{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink);padding:7px 0;margin:0;}
.checks > div{display:grid;gap:4px;}
.checks input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);}
.auto{font-size:13px;background:var(--accent-bg);border-radius:8px;padding:9px 11px;}
.err{font-size:13px;color:var(--alert);}
.empty{background:var(--surface);border-radius:12px;padding:16px;color:var(--muted);}
.login{max-width:380px;margin:40px auto;}
.login .form{padding:18px;}
.roles{display:grid;gap:8px;}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.btn.name{min-height:52px;font-size:16px;font-weight:500;text-align:left;}
details summary{cursor:pointer;color:var(--accent);font-size:14px;}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="title-row"><h1>SVI 169 Nguyễn Ngọc Vũ</h1><span class="who" id="who"></span></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div></header>
<main id="app" aria-live="polite"><p class="empty">Đang tải…</p></main>

<script>
/* ====== CẤU HÌNH: dán URL /exec của Apps Script vào giữa hai dấu nháy ====== */
var API_URL = 'https://script.google.com/macros/s/AKfycbwOuuPGuXQ-uSP-lF_f60S5F9MPuNQOHRUJsB85-iuNYuqtkQp7ZZ5waQ6WFuBwnKaoPA/exec';
/* ======================================================================================= */

(function(){
  var S = {role:null, pin:'', name:'', data:null, loading:false, err:null, tab:'tongquan', day:null, filter:'open',
    editing:null, busy:false, formErr:null, newInc:null, leave:null, bv:null, post:'', rcv:null, kt:null, vs:null, toast:null};
  var app = document.getElementById('app');
  var PATROL = ['20h','23h','02h','04h','06h'];

  // ---------- tiện ích ----------
  function el(tag,a,kids){ var n=document.createElement(tag);
    if(a){ for(var k in a){ var v=a[k]; if(v==null||v===false) continue;
      if(k==='class') n.className=v; else if(k==='text') n.textContent=v; else if(k==='value') n.value=v;
      else if(k.slice(0,2)==='on') n.addEventListener(k.slice(2),v); else n.setAttribute(k,v===true?'':v);} }
    (kids||[]).forEach(function(c){ if(c==null||c===false) return; n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return n; }
  function dm(id){ var p=String(id||'').split('-'); return p.length===3?p[2]+'/'+p[1]:String(id||''); }
  function dmy(id){ var p=String(id||'').slice(0,10).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(id||''); }
  function lv(t){ t=String(t||'').toLowerCase(); if(!t) return 'none';
    if(/^(bình thường|đạt|đã làm|không áp dụng|không phát sinh)/.test(t)) return 'ok';
    if(/chưa làm|chưa xử lý|có vấn đề|nghiêm trọng|hỏng|mất|không đạt/.test(t)) return 'alert';
    if(/đã xử lý|cần theo dõi/.test(t)) return 'watch'; if(/bất thường/.test(t)) return 'alert'; return 'watch'; }
  function blank(t){ t=String(t==null?'':t).trim().toLowerCase(); return !t||/^(không|ko|ko có|không có|bình thường|đầy đủ|ko vấn đề gì)\.?$/.test(t); }
  function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
  function load(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
  function D(){ return S.data; }
  function now(){ return new Date(); }
  function todayId(){ var z=new Date(now().getTime()+7*36e5); return z.toISOString().slice(0,10); }
  function hrs(iso){ var d=new Date(iso); return isNaN(d)?0:(now()-d)/36e5; }
  function SYS(){ return D().meta.systems; }
  function curDay(){ var ds=D().days; return ds.filter(function(d){return d.id===S.day;})[0]||ds[0]||null; }
  function toast(t){ S.toast=t; renderToast(); setTimeout(function(){ if(S.toast===t){ S.toast=null; renderToast(); } },2600); }
  function renderToast(){ var o=document.getElementById('toast'); if(o) o.remove(); if(S.toast) document.body.appendChild(el('div',{id:'toast',class:'toast',role:'status',text:S.toast})); }
  function canKT(){ return S.role==='kt'; } function canLeave(){ return S.role==='xem'; } function canVS(){ return S.role==='vs'||S.role==='kt'; } function canReport(){ return canVS()||S.role==='bv'; }

  // ---------- gọi Apps Script ----------
  function api(action, extra){
    var body = Object.assign({action:action, pin:S.pin, name:S.name}, extra||{});
    return fetch(API_URL,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)})
      .then(function(r){ return r.json(); });
  }
  function refresh(){
    S.loading=true; render();
    return api('summary').then(function(r){ S.loading=false;
      if(!r.ok){ if(/PIN|danh sách/.test(r.error||'')){ logout(); return; } S.err=r.error; render(); return; }
      S.data=r.data; S.err=null; if(!S.day||!S.data.days.some(function(d){return d.id===S.day;})) S.day=S.data.days[0]&&S.data.days[0].id; render(); })
      .catch(function(){ S.loading=false; S.err='Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'; render(); });
  }
  function logout(){ S.role=null; S.pin=''; S.name=''; S.data=null; S.full=null; S.vs=null; S.kt=null; S.bv=null; S.post=''; store('svi_post',null); store('svi_pin',null); store('svi_name',null); render(); }

  // ---------- quy tắc ----------
  function incOpen(i){ return i.status!=='Đã đóng'; }
  function incOver(i){ return incOpen(i)&&hrs(i.reportedAt)>D().meta.overdueH; }
  function incLevel(i){ if(!incOpen(i)) return 'ok'; if(incOver(i)||/nghiêm trọng/i.test(i.severity||'')) return 'alert'; return 'watch'; }
  function staffOf(dept){ var st=S.staffList||(D()&&D().meta.staff)||{}; return st[dept]||[]; }
  function norm(x){ return String(x||'').toLowerCase().replace(/\s+/g,' ').trim(); }
  function hhmm(){ var z=new Date(now().getTime()+7*36e5); return z.toISOString().slice(11,16); }
  function leavesOn(id){ return (D().leaves||[]).filter(function(l){ return l.from<=id && l.to>=id; }); }
  function leaveFor(id,name,shift){ return leavesOn(id).filter(function(l){ return norm(l.staff)===norm(name) && (l.shift==='Cả ngày'||l.shift===shift); })[0]; }
  // So báo cáo đã nộp với danh sách phải nộp; trừ người nghỉ có báo, ca chưa tới hạn, ngày không có ca
  var THU=['Chủ nhật','thứ 2','thứ 3','thứ 4','thứ 5','thứ 6','thứ 7'];
  // Lý do nghỉ: nghỉ cố định theo thứ, hoặc lịch nghỉ chị Linh ghi. Không nghỉ thì ''
  function offReason(dept,name,id,shift){ var R=D().meta.offRules||{}, wd=new Date(id+'T12:00:00+07:00').getDay();
    if((((R.dept||{})[dept])||[]).indexOf(wd)>=0) return 'nghỉ '+THU[wd];
    var P=R.person||{}; for(var k in P){ if(norm(k)===norm(name)&&P[k].indexOf(wd)>=0) return 'nghỉ '+THU[wd]; }
    var l=leavesOn(id).filter(function(l){ return norm(l.staff)===norm(name)&&(!shift||l.shift==='Cả ngày'||l.shift===shift); })[0];
    return l?String(l.reason||'nghỉ phép').toLowerCase():''; }
  // Ai đã nộp, ai thiếu: tính theo từng người, trừ người nghỉ
  function coverage(day){
    if(day.id<(D().meta.startDate||'')) return [];
    var M=D().meta, E=M.expected, DL=M.deadline||{}, t=day.id===todayId(), tm=hhmm(), out=[];
    function box(code,label){ return {code:code,label:label,got:0,exp:0,miss:[],off:[],pending:[],pendingLabel:'Chưa đến giờ nộp'}; }
    function addOff(r,t2){ if(r.off.indexOf(t2)<0) r.off.push(t2); }
    // Bảo vệ: mỗi người 1 báo cáo ca/ngày làm. Hôm nay người chưa nộp có thể đang trực đêm nên chưa tính thiếu
    var bv=box('BV','Báo cáo ca bảo vệ'); bv.pendingLabel='Chưa thấy báo cáo (có thể trực đêm, sáng mai nộp)';
    staffOf('Bảo vệ').forEach(function(n){ var done=day.ca.some(function(r){ return norm(r.staff)===norm(n); }), why=offReason('Bảo vệ',n,day.id);
      if(!done&&why){ addOff(bv,n+' ('+why+')'); return; } if(!done&&t){ bv.pending.push(n); return; }
      bv.exp++; if(done) bv.got++; else bv.miss.push(n); });
    out.push(bv);
    // Tạp vụ: mỗi người mỗi ca
    var vs=box('VS','Hết ca vệ sinh');
    E.vs.forEach(function(x){ var who=x[0], shift=x[1];
      function doneBy(w){ return day.vs.some(function(r){ return norm(r.staff)===norm(w)&&r.shift===shift; }); }
      var why=offReason('Tạp vụ',who,day.id,shift), l=leaveFor(day.id,who,shift);
      if(!doneBy(who)&&why){ addOff(vs,who+' ('+why+')'); return; }
      var done=doneBy(who), h=(DL.vs||{})[shift];
      if(!done&&t&&h&&tm<h){ vs.pending.push(who+' ca '+shift.toLowerCase()); return; }
      vs.exp++; if(done) vs.got++; else vs.miss.push(who+' ca '+shift.toLowerCase()); });
    out.push(vs);
    // Kỹ thuật: 1 nhật ký/ngày
    var kt=box('KT','Nhật ký kỹ thuật'), kn=staffOf('Kỹ thuật')[0], kw=kn?offReason('Kỹ thuật',kn,day.id):'';
    if(day.kt){ kt.exp=1; kt.got=1; } else if(kw) kt.off.push(kn+' ('+kw+')'); else if(t&&DL.kt&&tm<DL.kt) kt.pending.push('hạn '+DL.kt); else { kt.exp=1; kt.miss.push('chưa nộp'); }
    out.push(kt);
    return out;
  }
  // Thống kê tháng: máy chủ tính cả tháng; nếu thiếu thì tự tính từ 7 ngày có sẵn
  function attendance(){ if(D().attendance) return D().attendance; var today=todayId(), out=[];

    var kids=[ el('h3',{text:'Báo cáo cuối ca – '+S.post}), el('div',null,[el('span',{class:'fl',text:'Ca'}),shift]),
      el('div',null,[el('span',{class:'fl',text:'Việc đã làm đạt (bỏ tích việc có vấn đề)'}),list]) ];
    if(f.shift==='Đêm') kids.push(el('div',null,[ el('span',{class:'fl',text:'Mốc tuần tra đã đi (bỏ chọn mốc không đi)'}), el('div',{class:'seg',role:'group','aria-label':'Mốc tuần tra'},PATROL.map(function(p){ var on=f.patrol.indexOf(p)>=0;
      return el('button',{type:'button',class:'ok','aria-pressed':String(on),onclick:function(){ var k=f.patrol.indexOf(p); if(k>=0) f.patrol.splice(k,1); else f.patrol.push(p); f.patrol.sort(function(a,b){return PATROL.indexOf(a)-PATROL.indexOf(b);}); render(); }},[p]); })) ]));
    var ac=el('input',{type:'checkbox'}); ac.checked=f.assetsOk; ac.addEventListener('change',function(){ f.assetsOk=ac.checked; render(); });
    kids.push(el('div',{class:'checks'},[el('label',null,[ac,'Tài sản, thẻ, chìa khóa bàn giao đầy đủ'])]));
    if(!f.assetsOk) kids.push(bind(f,'assets',el('input',{type:'text','aria-label':'Thiếu tài sản gì',placeholder:'Thiếu gì? (bắt buộc)'})));
    if(S.post==='Sân') kids.push(field('Số lượt thang máy chuyển đồ (nếu có)',bind(f,'lift',el('input',{type:'text',inputmode:'numeric'}))));
    kids.push(field('Sự việc phát sinh trong ca (nếu có)',bind(f,'events',el('textarea',{placeholder:'Để trống nếu bình thường'}))));
    var nt=el('input',{type:'checkbox'}); nt.checked=f.needTech; nt.addEventListener('change',function(){ f.needTech=nt.checked; });
    kids.push(el('div',{class:'checks'},[el('label',null,[nt,'Sự việc này cần kỹ thuật xử lý (chuyển thành sự cố)'])]));
    kids.push(field('Bàn giao cho ca sau (người nhận ca sẽ thấy)',bind(f,'handover',el('textarea',{placeholder:'VD: chờ kỹ thuật thay bóng đèn hầm B2; khách để xe qua đêm'}))));
    if(S.formErr&&!S.editing&&!S.newInc) kids.push(el('p',{class:'err',text:S.formErr}));
    kids.push(el('button',{class:'btn pri big',type:'button',disabled:S.busy,onclick:function(){ saveBV(items); }},[S.busy?'Đang gửi…':'Gửi báo cáo ca']));
    return el('div',{class:'form'},kids); }
  function saveBV(items){ var f=S.bv, fails=Object.keys(f.fails).map(function(k){ return {item:k,note:String(f.fails[k]).trim()}; });
    if(fails.some(function(x){return !x.note;})){ S.formErr='Việc có vấn đề thì phải ghi rõ vấn đề gì.'; render(); return; }
    if(!f.assetsOk&&!String(f.assets).trim()){ S.formErr='Ghi rõ thiếu tài sản gì.'; render(); return; }
    if(f.needTech&&!String(f.events).trim()){ S.formErr='Cần kỹ thuật xử lý thì ghi rõ sự việc.'; render(); return; }
    S.busy=true; S.formErr=null; render();
    api('bv_report',{post:S.post,shift:f.shift,staff:S.name,fails:fails,total:items.length,patrol:f.shift==='Đêm'?f.patrol:null,assets:f.assetsOk?'Đầy đủ':f.assets,events:f.events,needTech:f.needTech,handover:f.handover,lift:f.lift}).then(function(r){ S.busy=false; if(!r.ok){S.formErr=r.error;render();return;}
      S.bv=null; toast(r.code?'Đã gửi. Sự việc đã chuyển kỹ thuật ('+r.code+')':'Đã gửi báo cáo ca'); return refresh(); }).catch(netErr); }

  // ---------- VÀO TRANG ----------
  // Nhân viên: bấm vào tên mình là vào, máy tự nhớ. Chỉ lãnh đạo cần mã PIN.
  function vLogin(){ if(!S.lg) S.lg={pin:'',name:''}; var st=S.lg, err=S.formErr, kids=[];
    kids.push(el('h3',{text:'Chọn tên của mình'}));
    if(!S.staffList) kids.push(el('p',{class:'small muted',text:'Đang tải danh sách tên…'}));
    var pick=el('select',{'aria-label':'Họ tên'},[el('option',{value:'',text:'– Chọn tên –'})].concat(['Tạp vụ','Bảo vệ','Kỹ thuật'].map(function(g){
      return el('optgroup',{label:g},staffOf(g).map(function(n){ return el('option',{value:n,text:n}); })); })));
    pick.value=st.name||''; pick.addEventListener('change',function(){ st.name=pick.value; });
    kids.push(pick);
    if(err) kids.push(el('p',{class:'err',text:err}));
    kids.push(el('button',{class:'btn pri big',type:'button',disabled:S.busy,onclick:function(){ if(!st.name){ S.formErr='Chọn tên trước khi vào.'; render(); return; } doLogin(st.name,''); }},[S.busy?'Đang vào…':'Vào']));
    kids.push(el('p',{class:'small muted',text:'Lần sau mở trang sẽ tự vào, không phải chọn lại.'}));
    var lead=[ el('h3',{text:'Lãnh đạo'}) ];
    var pin=el('input',{type:'password',inputmode:'numeric',autocomplete:'current-password','aria-label':'Mã PIN lãnh đạo',placeholder:'Mã PIN'});
      pin.value=st.pin; pin.addEventListener('input',function(){ st.pin=pin.value; });
      lead.push(pin); lead.push(el('button',{class:'btn pri big',type:'button',disabled:S.busy,onclick:function(){ if(!st.pin.trim()){ S.formErr='Nhập mã PIN lãnh đạo.'; render(); return; } doLogin('',st.pin.trim()); }},['Vào xem tổng quát']));
    return [el('div',{class:'login'},[ el('div',{class:'form'},kids), el('div',{class:'form',style:'margin-top:14px'},lead) ])]; }
  function doLogin(name,pin){ S.busy=true; S.formErr=null; S.name=name; S.pin=pin; render();
    api('login').then(function(r){ S.busy=false;
      if(!r.ok){ S.name=''; S.pin=''; S.formErr=r.error||'Chưa vào được'; render(); return; }
      S.role=r.role; S.lg=null;
      if(r.role==='xem'){ S.name=''; store('svi_pin',pin); } else store('svi_name',name);
      S.tab=tabsOf()[0][0]; refresh(); })
      .catch(function(){ S.busy=false; S.name=''; S.pin=''; S.formErr='Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'; render(); }); }

  function render(){
    header();
    if(!S.role){ app.replaceChildren.apply(app,vLogin()); return; }
    if(!S.data){ app.replaceChildren(el('p',{class:'empty',text:S.err||'Đang tải dữ liệu…'})); return; }
    try{ if(tabsOf().map(function(t){return t[0];}).indexOf(S.tab)<0) S.tab=tabsOf()[0][0];
    var v={tongquan:vOverview,suco:vIncidents,kythuat:vTech,tapvu:vClean,baove:vSec,nghi:vLeave}[S.tab](); v=v.filter(Boolean); app.replaceChildren.apply(app,v); }
    catch(e){ console.error(e); app.replaceChildren(el('p',{class:'empty',text:'Lỗi hiển thị: '+e.message})); }
  }

  // Mở lại trang: tự vào bằng tên hoặc mã đã nhớ
  if(!API_URL){ app.replaceChildren(el('p',{class:'stale',text:'Trang chưa được nối với Apps Script. Mở file index.html, dán URL /exec vào dòng API_URL.'})); return; }
  if(load('svi_pin')) doLogin('',load('svi_pin'));
  else if(load('svi_name')) doLogin(load('svi_name'),'');
  else render();
  // Bản thật: lấy danh sách tên mới nhất từ Apps Script cho màn hình chọn tên
  api('names').then(function(r){ if(r.ok){ S.staffList=r.staff; if(!S.role) render(); } }).catch(function(){});
})();
</script>
